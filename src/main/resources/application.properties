spring.application.name=edge-management

# ── 서버 ───────────────────────────────────────────────
# Vercel 컨테이너는 PORT 환경변수(기본 80)를 리슨해야 한다. 로컬은 8080.
server.port=${PORT:8080}
# Vercel 프록시 뒤에서 https 및 원래 호스트를 인식해야 OAuth 리다이렉트 URL이 깨지지 않는다.
server.forward-headers-strategy=framework
# 컨테이너가 SIGTERM을 받으면 30초 유예 안에 정리하고 내려간다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# ── Google 서비스 계정 ─────────────────────────────────
# 클라우드: 키 JSON 내용(원본 또는 base64)을 환경변수로 주입한다. 파일 업로드가 불가능하므로 이 경로만 동작한다.
google.service.account.keyJson=${GOOGLE_SERVICE_ACCOUNT_KEY_JSON:}
# 로컬 개발: 키 파일 경로. 위 값이 비어 있을 때만 사용된다.
google.service.account.keyPath=${GOOGLE_APPLICATION_CREDENTIALS:credentials/service-account.json}

# ── 접근 범위 ──────────────────────────────────────────
google.oauth.scopes=
google.drive.scopes=https://www.googleapis.com/auth/drive.readonly
google.sheets.scopes=https://www.googleapis.com/auth/spreadsheets

# ── DB ────────────────────────────────────────────────
# 아직 DB 미사용. 화이트리스트/세션을 DB로 옮길 때 이 두 줄을 제거한다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ── 로그인 / 인가 ──────────────────────────────────────
# 구글 OAuth 클라이언트 (신원 확인 전용 - 민감 스코프를 쓰지 않으므로 구글 심사 불필요)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# 이 드라이브 폴더에 공유된 계정만 사이트를 이용할 수 있다. 비어 있으면 전원 차단된다.
app.auth.drive-folder-id=${AUTH_DRIVE_FOLDER_ID:}
# 세션 쿠키 서명 키 (32바이트 이상)
app.auth.jwt-secret=${APP_JWT_SECRET:}
app.auth.session-ttl=PT12H
# 로컬 http 개발 시에는 APP_SECURE_COOKIE=false 로 내린다.
app.auth.secure-cookie=${APP_SECURE_COOKIE:true}
