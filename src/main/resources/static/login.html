<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · EDGE Management</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
           background:#f6f7f9; color:#1f2328; }
    @media (prefers-color-scheme: dark) { body { background:#15181c; color:#e6e6e6; } .card { background:#1f2429 !important; border-color:#31363c !important; } }
    .card { background:#fff; border:1px solid #e1e4e8; border-radius:12px; padding:40px 36px;
            width:min(92vw,380px); text-align:center; }
    h1 { font-size:1.15rem; margin:0 0 8px; }
    p  { font-size:.875rem; line-height:1.6; opacity:.75; margin:0 0 28px; }
    a.btn { display:flex; align-items:center; justify-content:center; gap:10px;
            padding:11px 16px; border:1px solid #d0d7de; border-radius:8px;
            text-decoration:none; color:inherit; font-weight:600; font-size:.9rem; }
    a.btn:hover { background:rgba(127,127,127,.08); }
    .denied { background:#fdeaea; color:#8b1a1a; border:1px solid #f5c2c2;
              border-radius:8px; padding:12px 14px; font-size:.82rem;
              line-height:1.6; margin-bottom:22px; text-align:left; }
    @media (prefers-color-scheme: dark) { .denied { background:#3a1d1d; color:#f5b5b5; border-color:#5c2b2b; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="denied" id="denied" hidden>
      이 계정에는 접근 권한이 없습니다.<br>
      운영 드라이브 폴더에 공유된 구글 계정으로 로그인해 주세요.
    </div>
    <h1>EDGE Management</h1>
    <p>운영 드라이브에 공유된 구글 계정만 이용할 수 있습니다.</p>
    <a class="btn" href="/oauth2/authorization/google">
      <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.7-.4-4H24v7.3h12.1c-.2 2-1.6 5-4.5 7l-.1.3 6.5 5 .4.1c4.1-3.8 6.7-9.4 6.7-15.7"/>
        <path fill="#34A853" d="M24 46c5.9 0 10.9-1.9 14.5-5.3l-6.9-5.3c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9l-.3.1-6.8 5.2-.1.3C7.9 41 15.4 46 24 46"/>
        <path fill="#FBBC05" d="M11.5 28.6c-.5-1.4-.7-2.9-.7-4.6s.3-3.2.7-4.6v-.3l-6.9-5.3-.2.1C2.8 17 2 20.4 2 24s.8 7 2.4 10.1z"/>
        <path fill="#EB4335" d="M24 10.4c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.1 29.9 2 24 2 15.4 2 7.9 7 4.4 13.9l7.1 5.5c1.8-5.2 6.7-9 12.5-9"/>
      </svg>
      Google 계정으로 로그인
    </a>
  </div>
  <script>
    if (location.search.includes('denied')) document.getElementById('denied').hidden = false;
  </script>
</body>
</html>
